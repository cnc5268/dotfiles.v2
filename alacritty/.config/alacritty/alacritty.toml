general.import = [
  "~/.config/alacritty/ayu-dark.toml"
]

[colors.primary]
background = "#000000"

[env]
TERM = "xterm-256color"

[font]
size = 13.0

[font.bold]
# family = "MesloLGS Nerd Font Mono"
family = "CaskaydiaCove Nerd Font"
style = "Bold"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
# family = "MesloLGS Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "CaskaydiaCove Nerd Font"
# family = "MesloLGS Nerd Font Mono"
style = "Italic"

[font.normal]
# family = "MesloLGS Nerd Font Mono"
family = "CaskaydiaCove Nerd Font"
style = "Regular"

[window]
opacity = 0.75
padding = { x = 5, y = 5 }
